# Firecracker's CI guest kernel has no iptables raw table, where Docker 28
# and later put rules that keep other machines on the link from reaching a
# published port directly. This tells dockerd to skip them (Docker 28.0.2 and
# later). The VM's link has one other end, the host, which reaches its ports
# anyway. images/base/check.sh fails an image without it.
[Service]
Environment=DOCKER_INSECURE_NO_IPTABLES_RAW=1
