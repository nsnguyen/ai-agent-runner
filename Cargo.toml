[package]
name = "ai-agent-runner"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "runner"

[[bin]]
name = "runner"
path = "src/main.rs"

# The agent inside each VM. Ships static: --target x86_64-unknown-linux-musl.
[[bin]]
name = "runner-guest"
path = "src/bin/runner-guest.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ext4-view = { version = "1", features = ["std"] }
libc = "0.2"
nix = { version = "0.31", features = ["fs", "poll", "process", "signal", "socket", "term", "user"] }
postcard = { version = "1", default-features = false, features = ["use-std"] }
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "io-std"] }
vsock = "0.5"

[dev-dependencies]
proptest = "1"
tempfile = "3"
