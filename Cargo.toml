[package]
name = "ai-agent-runner"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "runner"

[[bin]]
name = "runner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "io-std"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
